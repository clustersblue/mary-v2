# Retired. Run docker compose from the mary-v2 directory. See DEPLOYMENT.md.
services:
  fastapi:
    build: ./backend
    container_name: registryv2-api
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    # Development only (Windows / local testing) — comment out for production:
    # ports:
    #   - "8000:8000"

  vue:
    build: ./frontend
    container_name: registryv2-frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: registryv2-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - fastapi
      - vue
