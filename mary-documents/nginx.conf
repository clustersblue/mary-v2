# Frontend — registryv2.stmarysteamcare.co.uk
server {
    listen 80;
    server_name registryv2.stmarysteamcare.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name registryv2.stmarysteamcare.co.uk;

    ssl_certificate /etc/letsencrypt/live/registryv2.stmarysteamcare.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registryv2.stmarysteamcare.co.uk/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://vue:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Backend API — registryv2-api.stmarysteamcare.co.uk
server {
    listen 80;
    server_name registryv2-api.stmarysteamcare.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name registryv2-api.stmarysteamcare.co.uk;

    ssl_certificate /etc/letsencrypt/live/registryv2-api.stmarysteamcare.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registryv2-api.stmarysteamcare.co.uk/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20M;

    location / {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
