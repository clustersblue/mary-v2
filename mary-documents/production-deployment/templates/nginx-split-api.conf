# DO NOT DEPLOY until mary-element/src/service/api.js calls this origin
# and a new frontend image has been built. The current app calls /api/v1
# on the page host. This file is the backend vhost for a later split.
#
# Page host:  https://registryv2.stmarysteamcare.co.uk
# API host:   https://registryv2-api.stmarysteamcare.co.uk
#
# Issue a certificate that includes the API name, or a second certificate.
# Set ALLOWED_HOSTS to include registryv2-api.stmarysteamcare.co.uk.
# Set CORS_ORIGINS to https://registryv2.stmarysteamcare.co.uk only.

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=reset_limit:10m rate=5r/m;

server {
    listen 80;
    server_name registryv2-api.stmarysteamcare.co.uk;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name registryv2-api.stmarysteamcare.co.uk;
    server_tokens off;
    client_max_body_size 25m;

    ssl_certificate /etc/nginx/certs/api-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MarySSL:10m;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/v1/login {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location = /api/v1/forgot-password {
        limit_req zone=reset_limit burst=3 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location = /api/v1/reset-password {
        limit_req zone=reset_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location = /healthz {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        return 404;
    }
}
