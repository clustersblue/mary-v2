# Local stack. From this directory, with a filled-in .env:
#   docker compose up -d --build
# Open http://127.0.0.1:8080

name: mary-dev

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: ./mary-element
    image: mary-frontend:dev
    init: true
    restart: unless-stopped
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging: *logging

  backend:
    build:
      context: ./mary-fastapi
    image: mary-backend:dev
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./mary-fastapi/storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging: *logging

  proxy:
    image: nginx:stable-alpine
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    logging: *logging

volumes:
  redis_data:
